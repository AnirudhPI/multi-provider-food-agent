spring:
  application:
    name: multi-provider-food-agent
  ai:
    mcp:
      client:
        enabled: ${SWIGGY_MCP_ENABLED:false}
        name: multi-provider-food-agent
        version: 0.0.1
        type: SYNC
        initialized: false
        request-timeout: ${SWIGGY_MCP_TIMEOUT:20s}
        toolcallback:
          enabled: false
        annotation-scanner:
          enabled: false
        streamable-http:
          connections:
            swiggy-food:
              url: ${food-agent.providers.swiggy.base-url}
              endpoint: /food
    ollama:
      base-url: ${food-agent.model.base-url}
      chat:
        options:
          model: ${food-agent.model.model}
          temperature: ${food-agent.model.temperature}
          num-ctx: ${food-agent.model.context-window}

food-agent:
  providers:
    swiggy:
      enabled: ${SWIGGY_MCP_ENABLED:false}
      base-url: ${SWIGGY_MCP_BASE_URL:https://mcp.swiggy.com}
      access-token: ${SWIGGY_MCP_ACCESS_TOKEN:}
  model:
    provider: ${MODEL_PROVIDER:ollama}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3:8b}
    timeout: ${MODEL_TIMEOUT:60s}
    temperature: ${OLLAMA_TEMPERATURE:0.1}
    context-window: ${OLLAMA_CONTEXT_WINDOW:8192}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  shutdown: graceful
